schema: spec-driven

# Constraints for every proposal, spec, design and task list in this project.
context: |
  LeafMD is a GNOME desktop app (Rust, GTK4, libadwaita), shipped as a Flatpak.
  It aims to stay a simple, dependable markdown viewer and editor: every
  feature should feel obvious without needing a setting.
  The owner reads every artifact. Write in plain, conversational English, and
  explain any technical term in a few words. Never use em dashes; use a
  period, comma, colon or parentheses instead.
  Specs describe what the user sees and does (keys, buttons, messages), not
  how the code is built.

rules:
  proposal:
    - Say what is out of scope.
    - Name any new keyboard shortcut, menu item or setting, since each one adds to the app.
  specs:
    - Use LeafMD as the subject, for example "LeafMD SHALL ...".
    - Give scenarios concrete examples (real text, real keys), not placeholders.
  tasks:
    - "Include updating every place users read about the change, where it applies: Help, Keyboard Shortcuts, README, the app store description in data/*.metainfo.xml, and ticking the item in ROADMAP.md."
    - "When the change adds behaviour the end-to-end tests can check (typing, keys, saving, windows and tabs, what LeafMD remembers), add a scenario for it in build-aux/end-to-end/, following the files already there. They can't check how things look, file dialogs or dragging."
    - End with rebuilding and installing the Flatpak (./build-aux/flatpak-install.sh), then running ./build-aux/end-to-end-tests.sh, so the owner can try the change.
