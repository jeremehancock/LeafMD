  </defs>
  <!-- soft shadow under the page -->
  <path d="M30 18h50l28 28v66a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V28a10 10 0 0 1 10-10z" fill="#000" opacity=".18"/>
