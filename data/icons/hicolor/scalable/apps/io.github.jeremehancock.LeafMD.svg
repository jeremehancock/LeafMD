      <stop offset="1" stop-color="#e8e6e3"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8f5a"/>
      <stop offset="1" stop-color="#57e389"/>
