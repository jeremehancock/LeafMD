  <rect x="50" y="29" width="20" height="6" rx="3" fill="#5e5c64"/>
  <rect x="36" y="46" width="56" height="4" rx="2" fill="#c0bfbc"/>
  <rect x="36" y="56" width="44" height="4" rx="2" fill="#c0bfbc"/>
  <!-- the leaf -->
  <path d="M38 106C38 78 58 64 92 64c0 28-20 42-54 42z" fill="url(#leaf)"/>
  <path d="M42 102c12-12 26-22 44-32" fill="none" stroke="#14653f" stroke-width="3" stroke-linecap="round"/>
