[package]
name = "leafmd"
version = "0.14.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/jeremehancock/LeafMD"
description = "A markdown viewer and editor with formatted, raw and split views"

[dependencies]
# GTK4 and libadwaita: the window, buttons and dialogs (GNOME's toolkit)
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
# GtkSourceView: the raw text editor (syntax colouring, line numbers, undo)
sourceview5 = "0.11"
# libspelling: underlines misspelt words in the raw text and offers
# corrections on right-click (the same library GNOME Text Editor uses)
libspelling = "0.5"
# WebKitGTK: shows the formatted view
webkit6 = "0.6"
# Markdown to HTML. Default features are turned off to skip its command-line tool.
comrak = { version = "0.59", default-features = false }
# Removes anything unsafe (scripts and so on) from the formatted HTML
ammonia = "4"
# Safely wraps the HTML in a JavaScript string when updating the preview
serde_json = "1"
# The one system call (setsid) that frees the terminal LeafMD was started from
libc = "0.2"

[build-dependencies]
# Builds the icons in data/resources into the program
glib-build-tools = "0.22"

[profile.release]
lto = true
strip = true
