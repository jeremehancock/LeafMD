name: Build

# Pushes are checked and built as a Flatpak, in the same GNOME 51 environment
# the app is built in on the owner's laptop, but only when the build could
# give a new answer. A full build takes five to ten minutes, so a quick first
# job ("Decide what to build") works out whether this one needs it.
#
#   push to dev (or    -> checks (including Flathub's), then a test .flatpak
#   any branch but        kept for 7 days (Actions tab -> the run -> Artifacts),
#   main)                 unless the files that go into the app and its checks
#                         are exactly the same as in a build that already
#                         passed on this branch. Then the build shows as
#                         skipped, which GitHub counts as passing. So these
#                         skip it:
#                           - a push that only changes the docs, the specs,
#                             the roadmap or leafmd.app's site/ folder
#                           - the push that moves dev up to main's merge
#                             commit after a pull request, which holds the
#                             same app dev has just built
#                         "The same" is judged by a fingerprint of every file
#                         except those listed in IGNORED below.
#   push to main       -> nothing is built, unless it's a release (below).
#                         main only changes by merging a pull request from
#                         dev, and GitHub won't allow that merge until dev's
#                         build of the same app has passed.
#   "Run workflow"     -> always builds, on any branch, for when a build is
#   (not republish)       wanted anyway (a fresh test .flatpak, say)
#
#   push to main that's a release: the version is a finished release
#                         (its <release> in the metainfo file isn't marked
#                         type="development") and has no v<version> tag yet.
#                         It's always built, from scratch, and:
#                           - the build is signed with LeafMD's key
#                           - a v<version> tag and a GitHub Release, with the
#                             .flatpak attached and the metainfo release notes
#                           - leafmd.app is published: the storefront, the
#                             install files and the signed Flatpak repository
#                             that installed copies get their updates from
#                           - that repository is also attached to the GitHub
#                             Release as leafmd-repository-<version>.tar.gz
#
#   "Run workflow" on main, with "Republish leafmd.app" ticked
#   (gh workflow run ci.yml --ref main -f republish=true)
#                      -> publishes leafmd.app again without building anything:
#                         the site's text and design from main, with the newest
#                         release's version, icon, screenshots and repository
#                         (its archive), so installed copies see no update
#
# Changes reach main only through a pull request from dev, so a release
# happens when the owner merges one. See .claude/commands/ship.md.
#
# Every job runs on ubuntu-latest, on purpose, rather than a fixed Ubuntu
# version. The app itself is built inside Flathub's own Fedora image (the
# build job's container), so the Ubuntu version never touches what goes into
# LeafMD. The other jobs only use git, bash, Python's standard library and the
# gh tool, which every Ubuntu GitHub offers has. A fixed version would have to
# be moved by hand whenever GitHub retires it, for no gain.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      republish:
        description: Republish leafmd.app (main only, uses the newest release, builds nothing)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide what to build
    # A republish builds nothing (on a push there's no input, which counts as
    # false)
    if: ${{ !inputs.republish }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.release.outputs.release }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this a release?
        id: release
        run: |
          info=$(build-aux/release-info.py)
          version=$(sed -n 's/^version=//p' <<< "$info")
          stable=$(sed -n 's/^stable=//p' <<< "$info")
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$stable" = true ] &&
             [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "Yes: v$version isn't released yet, so this build is signed and published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No: nothing is signed or published."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # A fingerprint of every file in this commit that goes into the app or
      # its checks: each file's name and the ID git gives its contents, so
      # changing, adding or removing any of them changes the fingerprint.
      # IGNORED is what can't change the build's answer: the docs, the specs,
      # the roadmap, Claude's instructions, and the site (only a release, which
      # always builds, uses it). Anything not listed counts, including this
      # file, so changing how the build works always rebuilds.
      - name: Fingerprint the files the build uses
        id: fingerprint
        env:
          IGNORED: '^(docs/|openspec/|site/|\.claude/|README\.md$|ROADMAP\.md$|CLAUDE\.md$)'
        run: |
          # ENVIRON, not awk -v, which would turn the pattern's \. into "any character"
          fingerprint=$(git ls-tree -r HEAD | awk -F '\t' '$2 !~ ENVIRON["IGNORED"]' |
            sha256sum | cut -c1-32)
          echo "Fingerprint: $fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # The build job leaves an empty marker in GitHub's cache, named after
      # the fingerprint, each time it passes on a branch other than main. A
      # branch only sees its own markers (and main's, which never has any), and
      # GitHub deletes one after 7 days unused, which just means building again.
      - name: Has this branch already passed a build of these files?
        id: passed
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: build-passed
          key: build-passed-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          PASSED: ${{ steps.passed.outputs.cache-hit }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE" = true ]; then
            echo "Building: this is a release."
            build=true
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "Building: asked for by hand."
            build=true
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "Not building: main only gets merges from dev, whose build of the same app passed before GitHub allowed the merge."
            build=false
          elif [ "$PASSED" = true ]; then
            echo "Not building: a build of exactly these files already passed on this branch. Only files the build doesn't use changed."
            build=false
          else
            echo "Building: files the build uses have changed since the last build that passed."
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Check · Build Flatpak
    needs: plan
    # Runs when the plan says so. If the plan job itself fails, this runs
    # anyway rather than being skipped, because GitHub counts a skipped job as
    # passing, and a broken plan mustn't let an unchecked pull request through.
    # (Without the plan's answer it's treated as not a release, so nothing is
    # signed or published.) Not after a republish, or if the run was cancelled.
    if: >-
      ${{ !cancelled() && !inputs.republish
      && (needs.plan.result != 'success' || needs.plan.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    # Flathub's own build image: Fedora with flatpak, flatpak-builder and the
    # GNOME 51 SDK already installed. "privileged" lets it run the sandbox.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    outputs:
      version: ${{ steps.info.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      # The checkout belongs to GitHub's runner account, but this container
      # runs as root, and the Flatpak sandbox gives up root's power to write
      # to other people's folders. Owning the checkout lets the checks create
      # ./vendor and ./target in it.
      - name: Take ownership of the checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Read the version
        id: info
        run: build-aux/release-info.py | tee -a "$GITHUB_OUTPUT"

      # The plan job worked this out. Only its exact "true" counts, so if the
      # plan failed, nothing is signed or published.
      - name: Is this a release?
        id: release
        env:
          PLAN_RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          if [ "$PLAN_RELEASE" = true ]; then
            echo "Yes: this build is signed and published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No: nothing is signed or published."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the SDK's Rust extension and anything else the recipe needs
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --install-deps-only \
            flatpak-build build-aux/io.github.jeremehancock.LeafMD.json

      # The cache below is only good for the same Rust and GNOME SDK, so its
      # name includes the exact versions (their commit IDs) of the two.
      - name: Find which Rust and SDK this run uses
        id: toolchain
        if: steps.release.outputs.release != 'true'
        run: |
          id=$(flatpak list --runtime --columns=ref,active |
            grep -E '^org\.gnome\.Sdk/|rust-stable' | sort | sha256sum | cut -c1-16)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Keeps the checks from recompiling every Rust library each time, which
      # is most of their two minutes. LeafMD's own code still gets checked and
      # tested every run, because a fresh checkout makes Cargo see it as changed.
      #
      # This only touches target/sdk, which the checks use. The Flatpak step
      # below never sees it (the recipe skips ./target), so what people install
      # is never built from cached files. A release skips the cache altogether,
      # so its checks run from scratch too, before the signing key is loaded.
      #
      # If Cargo.lock changed, the newest cache for this Rust and SDK is the
      # starting point, so only the libraries that changed are recompiled. GitHub
      # saves a cache only when the whole job passes, and deletes it after 7
      # days unused. A branch can read its own caches and main's. (main only
      # builds releases, which skip this cache, so in practice it's dev's.)
      - name: Restore compiled Rust libraries
        if: steps.release.outputs.release != 'true'
        uses: actions/cache@v6
        with:
          path: target/sdk
          key: sdk-check-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: sdk-check-${{ steps.toolchain.outputs.id }}-

      - name: Clippy, tests, app store and .desktop checks
        run: build-aux/sdk-check.sh

      # Only for a release. The private key lives in a GitHub secret and is
      # loaded into a throwaway GPG folder that's gone when the job ends. Its
      # public half is build-aux/leafmd-signing-key.gpg, which says which key
      # to sign with.
      - name: Load the signing key
        if: steps.release.outputs.release == 'true'
        env:
          LEAFMD_GPG_PRIVATE_KEY: ${{ secrets.LEAFMD_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$LEAFMD_GPG_PRIVATE_KEY" ]; then
            echo "::error::The LEAFMD_GPG_PRIVATE_KEY secret isn't set, so this release can't be signed. See docs/PUBLISHING.md, Publishing setup."
            exit 1
          fi
          command -v gpg > /dev/null || dnf install -y gnupg2
          gnupg=$(mktemp -d)
          chmod 700 "$gnupg"
          printf '%s\n' "$LEAFMD_GPG_PRIVATE_KEY" | gpg --homedir "$gnupg" --batch --import
          key_id=$(gpg --show-keys --with-colons build-aux/leafmd-signing-key.gpg | awk -F: '/^pub/ { print $5; exit }')
          gpg --homedir "$gnupg" --list-secret-keys "$key_id" > /dev/null
          echo "GPG_ARGS=--gpg-sign=$key_id --gpg-homedir=$gnupg" >> "$GITHUB_ENV"

      - name: Build the Flatpak
        # rofiles-fuse can't run in a container; it only saves disk space.
        # GPG_ARGS is only set for a release, so other builds aren't signed.
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --default-branch=stable --repo=repo $GPG_ARGS \
            flatpak-build build-aux/io.github.jeremehancock.LeafMD.json
          flatpak build-update-repo --title=LeafMD --generate-static-deltas $GPG_ARGS repo

      - name: Flathub's checks on the recipe, app store description and build
        run: build-aux/flathub-lint.sh --gha-format repo

      - name: Make the .flatpak file
        # --runtime-repo lets GNOME Software fetch the GNOME runtime from
        # Flathub when someone installs the file. A release's file also points
        # at leafmd.app and carries the public key, so installs from it get
        # updates. Test files from other builds don't.
        env:
          VERSION: ${{ steps.info.outputs.version }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          extra=()
          if [ "$RELEASE" = true ]; then
            extra=(--repo-url=https://leafmd.app/repo/ --gpg-keys=build-aux/leafmd-signing-key.gpg)
          fi
          flatpak build-bundle repo "LeafMD-$VERSION.flatpak" io.github.jeremehancock.LeafMD stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo "${extra[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: LeafMD-flatpak
          path: LeafMD-*.flatpak
          retention-days: 7
          if-no-files-found: error

      # The signed repository, exactly as leafmd.app will serve it. Attached to
      # the GitHub Release, so a republish can serve it again without
      # rebuilding (a rebuild would make a new commit, which installed copies
      # would see as an update to the version they already have).
      - name: Pack the repository for the GitHub Release
        if: steps.release.outputs.release == 'true'
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: tar -czf "leafmd-repository-$VERSION.tar.gz" repo

      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.release == 'true'
        with:
          name: leafmd-repository
          path: leafmd-repository-*.tar.gz
          if-no-files-found: error

      - name: Build leafmd.app
        if: steps.release.outputs.release == 'true'
        run: |
          build-aux/build-site.py _site --base-url https://leafmd.app/ \
            --repo repo --key build-aux/leafmd-signing-key.gpg

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.release == 'true'
        with:
          path: _site

      # Last, so it only happens when everything above passed: leaves the
      # marker the plan job looks for, so a later push with exactly these
      # files (say, one that only changes the docs) doesn't build them again.
      # Not on main, which never looks for one, and not when the plan failed
      # and left no fingerprint.
      - name: Note that these files passed
        if: github.ref != 'refs/heads/main' && needs.plan.outputs.fingerprint != ''
        run: touch build-passed

      - name: Save that note
        if: github.ref != 'refs/heads/main' && needs.plan.outputs.fingerprint != ''
        uses: actions/cache/save@v6
        with:
          path: build-passed
          key: build-passed-${{ needs.plan.outputs.fingerprint }}

  release:
    # A plain name: GitHub shows a skipped job's name without filling it in
    name: Release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the tag and the GitHub Release
      pages: write      # to publish leafmd.app
      id-token: write   # lets GitHub Pages check this job is allowed to publish
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: LeafMD-flatpak

      - uses: actions/download-artifact@v8
        with:
          name: leafmd-repository

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Already there if this job is being re-run to publish leafmd.app again
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; only publishing leafmd.app."
            gh release upload "v$VERSION" "leafmd-repository-$VERSION.tar.gz" --clobber
            exit 0
          fi
          {
            build-aux/release-info.py --notes
            echo
            echo "## Installing"
            echo
            echo "Go to **https://leafmd.app/** and click Install, or run:"
            echo
            echo '```'
            echo "flatpak install https://leafmd.app/LeafMD.flatpakref"
            echo '```'
            echo
            echo "Either way, updates arrive through GNOME Software (or \`flatpak update\`) from then on."
            echo "\`LeafMD-$VERSION.flatpak\` below works too: open it with GNOME Software, and it updates the same way."
            echo
            echo "(\`leafmd-repository-$VERSION.tar.gz\` is the update repository leafmd.app serves. It isn't needed for installing.)"
          } > notes.md
          gh release create "v$VERSION" "LeafMD-$VERSION.flatpak" "leafmd-repository-$VERSION.tar.gz" \
            --target "$GITHUB_SHA" --title "LeafMD $VERSION" --notes-file notes.md

      # After the GitHub Release, so a publishing problem can't stop the
      # release itself. Re-running this job publishes again.
      - name: Publish leafmd.app
        id: pages
        uses: actions/deploy-pages@v5

  republish:
    name: Republish leafmd.app
    if: ${{ inputs.republish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read    # to download the newest release's repository
      pages: write      # to publish leafmd.app
      id-token: write   # lets GitHub Pages check this job is allowed to publish
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Republish from main: it publishes main's site/ folder."
          exit 1

      # All history and tags, so the site can take the release's version,
      # icon and screenshots from its tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get the newest release's repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          archive="leafmd-repository-${tag#v}.tar.gz"
          if ! gh release download "$tag" --pattern "$archive"; then
            echo "::error::$tag has no $archive attached, so there's nothing to republish. See docs/PUBLISHING.md."
            exit 1
          fi
          tar -xzf "$archive"
          echo "Republishing with $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build leafmd.app
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          build-aux/build-site.py _site --base-url https://leafmd.app/ \
            --repo repo --key build-aux/leafmd-signing-key.gpg --release-tag "$TAG"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish leafmd.app
        id: pages
        uses: actions/deploy-pages@v5
